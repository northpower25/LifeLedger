name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include health information or credentials. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide steps using synthetic data only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the affected component, version or commit, and platform.
