name: Windows offline slice

on:
  push:
    branches: [implementation/first-offline-vertical-slice]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-desktop/package-lock.json
      - name: Install backend test dependencies
        run: python -m pip install -e "./backend[test]"
      - name: Run backend tests on Windows
        run: python -m pytest backend/tests -q
      - name: Build Windows API sidecar
        run: ./backend/scripts/build_windows_sidecar.ps1
      - name: Install frontend dependencies
        working-directory: frontend-desktop
        run: npm ci
      - name: Build Windows desktop and installers
        working-directory: frontend-desktop
        run: npm run tauri build
      - name: Upload unsigned internal test builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LifeLedger-windows-internal-test
          if-no-files-found: error
          path: |
            frontend-desktop/src-tauri/target/release/lifeledger-desktop.exe
            frontend-desktop/src-tauri/target/release/bundle/**/*.msi
            frontend-desktop/src-tauri/target/release/bundle/**/*.exe
