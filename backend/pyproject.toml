[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeledger-offline-api"
version = "0.1.0"
description = "Local-only synthetic-data API for the LifeLedger first vertical slice"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pyotp>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]
package = ["pyinstaller>=6.10,<7"]

[project.scripts]
lifeledger-api = "lifeledger.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["lifeledger*"]

[tool.setuptools.package-data]
lifeledger = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
